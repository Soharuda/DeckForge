<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft Mode — screen editor</title>
<style>
  :root{
    --page:#0f2419; --panel:#173327; --ink:#f0ead8; --muted:#9db4a6; --metal:#d8c48a;
    --ground:#13221b; --line:rgba(216,196,138,.22); --sel:#e6d37a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#0b1511;color:var(--ink);
    font:13px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{padding:14px 18px 8px;border-bottom:1px solid rgba(216,196,138,.14)}
  h1{margin:0 0 2px;font-size:15px;letter-spacing:.01em}
  .sub{color:var(--muted);font-size:12px;max-width:70ch}
  main{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding:14px 18px 40px}
  @media(min-width:1080px){main{grid-template-columns:minmax(0,1fr) 340px;align-items:start}
    .inspector{position:sticky;top:14px}}
  .boardbox{background:var(--ground);border:1px solid rgba(216,196,138,.18);border-radius:12px;
    padding:10px;overflow:hidden}
  .stagewrap{position:relative;width:100%;overflow:hidden}
  .stage{position:absolute;top:0;left:0;background:var(--ground);border-radius:8px;
    transform-origin:top left;overflow:hidden;cursor:crosshair}
  .el{position:absolute;min-width:8px;min-height:8px;cursor:move;user-select:none}
  .el.sel{outline:1.5px solid var(--sel);outline-offset:0}
  .handle{position:absolute;right:-5px;bottom:-5px;width:10px;height:10px;border-radius:2px;
    background:var(--sel);cursor:nwse-resize;display:none}
  .el.sel .handle{display:block}
  .panel{background:rgba(23,51,39,.55);border:1px solid rgba(216,196,138,.20);border-radius:8px;
    padding:3px 5px;color:var(--muted);font-size:9px;overflow:hidden}
  .label{color:var(--ink);overflow:hidden;white-space:nowrap}
  .label.muted{color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:5px;background:rgba(23,51,39,.85);
    border:1px solid rgba(216,196,138,.28);border-radius:999px;padding:0 8px;color:var(--metal);
    font-weight:700;justify-content:center;overflow:hidden}
  .button{display:flex;align-items:center;justify-content:center;background:rgba(216,196,138,.16);
    border:1px solid rgba(216,196,138,.45);border-radius:7px;color:var(--ink);font-weight:600;
    overflow:hidden}
  .divider{background:rgba(216,196,138,.28);border-radius:2px}
  .cardimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;
    border-radius:3px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
  .cardtext{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:2px;color:var(--muted);font-size:9px;background:rgba(23,51,39,.9);
    border-radius:3px;border:1px solid rgba(216,196,138,.2);overflow:hidden}
  .row{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;
    gap:2px;overflow:hidden}
  .row .slot{position:relative;height:100%;flex:0 0 auto}
  .inspector{display:grid;gap:10px;min-width:0}
  .card{background:var(--panel);border:1px solid rgba(216,196,138,.16);border-radius:10px;
    padding:10px 11px;min-width:0}
  .card h2{margin:0 0 7px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--metal);font-weight:700}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .grid.three{grid-template-columns:1fr 1fr 1fr}
  label.f{display:grid;gap:2px;font-size:10px;color:var(--muted)}
  input,select,button,textarea{font:inherit;color:var(--ink);background:#0d1d16;
    border:1px solid rgba(216,196,138,.28);border-radius:6px;padding:4px 6px;min-width:0}
  input[type=range]{padding:0;background:none;border:none}
  button{cursor:pointer;background:rgba(216,196,138,.14)}
  button:hover{background:rgba(216,196,138,.24)}
  button.wide{width:100%}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chips button{padding:3px 7px;font-size:11px}
  .list{display:grid;gap:4px;max-height:230px;overflow:auto}
  .item{display:grid;grid-template-columns:16px minmax(0,1fr) repeat(3,22px);gap:4px;
    align-items:center;padding:3px 5px;border-radius:6px;background:rgba(13,29,22,.6);
    border:1px solid transparent;cursor:pointer}
  .item.on{border-color:rgba(230,211,122,.6)}
  .item b{font-weight:600;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item span.k{color:var(--muted);font-size:9px}
  .item button{padding:0;height:18px;font-size:10px;line-height:1}
  .io textarea{width:100%;height:150px;font:10px/1.4 ui-monospace,Menlo,monospace;resize:vertical}
  .note{color:var(--muted);font-size:11px}
  .readout{display:flex;flex-wrap:wrap;gap:4px 10px;color:var(--muted);font-size:11px;
    font-variant-numeric:tabular-nums}
  .readout b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<header>
  <h1>Draft Mode — screen editor</h1>
  <div class="sub">Drag anything. Pull the corner to resize. Add and remove what you like. Then
    hit Export and paste me the JSON.</div>
</header>
<main>
  <section class="boardbox">
    <div class="stagewrap" id="wrap"><div class="stage" id="stage"></div></div>
    <div class="readout" id="readout" style="margin-top:8px"></div>
  </section>
  <aside class="inspector">
    <div class="card">
      <h2>Screen</h2>
      <div class="grid three">
        <label class="f">width (dp)<input id="sw" type="number" value="914"></label>
        <label class="f">height (dp)<input id="sh" type="number" value="411"></label>
        <label class="f">grid<input id="snap" type="number" value="1" min="1" step="1"></label>
      </div>
      <div class="chips" style="margin-top:6px">
        <button id="presetLand">landscape 914×411</button>
        <button id="presetPort">portrait 411×914</button>
        <button id="presetTall">tall 411×740</button>
      </div>
    </div>
    <div class="card">
      <h2>Add</h2>
      <div class="chips" id="palette"></div>
    </div>
    <div class="card">
      <h2>Elements</h2>
      <div class="list" id="list"></div>
    </div>
    <div class="card" id="insp">
      <h2>Selected</h2>
      <div class="note" id="inspEmpty">Nothing selected. Click something on the screen, or add one.</div>
      <div id="inspBody" style="display:none">
        <div class="grid">
          <label class="f">name<input id="eName" type="text"></label>
          <label class="f">kind<input id="eKind" type="text" disabled></label>
        </div>
        <div class="grid" style="margin-top:6px">
          <label class="f">x<input id="eX" type="number" step="1"></label>
          <label class="f">y<input id="eY" type="number" step="1"></label>
          <label class="f">width<input id="eW" type="number" step="1"></label>
          <label class="f">height<input id="eH" type="number" step="1"></label>
        </div>
        <div id="eTextRow" style="margin-top:6px">
          <label class="f">text<input id="eText" type="text"></label>
        </div>
        <div id="eCardRow" style="margin-top:6px">
          <label class="f">card<select id="eCard"></select></label>
        </div>
        <div class="grid" style="margin-top:6px">
          <label class="f" id="eCountWrap">cards<input id="eCount" type="number" min="1" max="15" step="1"></label>
          <label class="f" id="eColsWrap">columns<input id="eCols" type="number" min="1" max="8" step="1"></label>
          <label class="f">font<input id="eSize" type="number" min="5" max="40" step="1"></label>
        </div>
        <div class="grid" style="margin-top:6px">
          <label class="f">align<select id="eAlign"><option>start</option><option>center</option><option>end</option></select></label>
          <label class="f">tone<select id="eTone"><option>ink</option><option>muted</option><option>metal</option></select></label>
        </div>
        <div class="chips" style="margin-top:8px">
          <button id="eUp">bring forward</button>
          <button id="eDown">send back</button>
          <button id="eDup">duplicate</button>
          <button id="eDel">delete</button>
        </div>
      </div>
    </div>
    <div class="card io">
      <h2>Export</h2>
      <textarea id="out" spellcheck="false" readonly></textarea>
      <div class="chips" style="margin-top:6px">
        <button id="copy">Copy</button>
        <button id="refresh">Refresh</button>
        <button id="reset">Reset to the starter</button>
      </div>
      <h2 style="margin-top:12px">Import</h2>
      <textarea id="in" placeholder="paste an export here" spellcheck="false"></textarea>
      <button id="apply" class="wide" style="margin-top:6px">Apply</button>
      <p class="note" id="note"></p>
    </div>
  </aside>
</main>
<script>
/* The draft screen, as a layout you can argue with.
   There is no Draft screen in the app yet, so this starts from the furniture a draft needs -
   the pack, the picks you have made, the pool, a clock, and the ways out - and everything on it
   is yours to move, resize, rename, throw away or add to. Export prints JSON; that is what gets
   written into the app. */

const CARDS = {
  "Forest":"https://cards.scryfall.io/normal/front/2/e/2e781bfd-f8cb-4d20-b977-4359f3a21311.jpg?1791578317",
  "Island":"https://cards.scryfall.io/normal/front/1/3/1335d293-3dd2-4f13-bd2c-22181f4528ee.jpg?1791578424",
  "Command Tower":"https://cards.scryfall.io/normal/front/a/7/a73297d2-580c-4174-a427-265f6916d09f.jpg?1793021256",
  "Overgrown Tomb":"https://cards.scryfall.io/normal/front/a/d/ad7e18e2-c033-4b6c-86e8-d0e5cc824cfd.jpg?1793894789",
  "Swamp":"https://cards.scryfall.io/normal/front/b/2/b233b117-9369-45c1-80c5-cc857386b6be.jpg?1791578437",
  "Barren Moor":"https://cards.scryfall.io/normal/front/3/8/380eb7fd-bc79-4cad-9c2b-9b2b10761a72.jpg?1783909580",
  "Llanowar Elves":"https://cards.scryfall.io/normal/front/6/a/6a0b230b-d391-4998-a3f7-7b158a0ec2cd.jpg?1783909057",
  "Grizzly Bears":"https://cards.scryfall.io/normal/front/4/0/409f9b88-f03e-40b6-9883-68c14c37c0de.jpg?1783943001",
  "Arbor Elf":"https://cards.scryfall.io/normal/front/4/b/4b81165e-f091-4211-8b47-5ea6868b0d4c.jpg?1783935136",
  "Vampire Nighthawk":"https://cards.scryfall.io/normal/front/7/a/7aff07f9-9528-4149-9af0-f4e3c66c9dc5.jpg?1787562825",
  "Bloodghast":"https://cards.scryfall.io/normal/front/c/e/cee85485-598f-4dfc-aa0b-7b1de86c7788.jpg?1783903786",
  "Sol Ring":"https://cards.scryfall.io/normal/front/f/c/fc817e07-c1f3-469f-9cf7-0945dea7400f.jpg?1793021181",
  "Rancor":"https://cards.scryfall.io/normal/front/8/6/86d6b411-4a31-4bfc-8dd6-e19f553bb29b.jpg?1783921864",
  "Charcoal Diamond":"https://cards.scryfall.io/normal/front/f/0/f0475c79-bc7f-4de8-a020-226bc658d303.jpg?1783922679",
  "Cultivate":"https://cards.scryfall.io/normal/front/a/7/a78f5d3f-74d6-4ec1-89c4-e24639d3f4ba.jpg?1793281380",
  "Beast Within":"https://cards.scryfall.io/normal/front/1/9/1929cf4b-0d18-4f7d-a631-621a378ff015.jpg?1793281367",
  "Eternal Witness":"https://cards.scryfall.io/normal/front/3/9/39704000-65d3-4d39-849e-a3b617376bbc.jpg?1783915632",
  "Harmonize":"https://cards.scryfall.io/normal/front/4/e/4e9c9e24-7f41-402c-b346-e553cee90c58.jpg?1793281397",
  "Overrun":"https://cards.scryfall.io/normal/front/1/d/1d8e9cbb-8bf4-4a48-a58e-79deb3abdf7f.jpg?1783909056"
};

/* The starter screen: a pack on the left, the picks you have taken on the right, the pool along
   the bottom, and the clock. Everything here is furniture, not a specification. */
const STARTER = {
  kind: "deckforge.battle.draft", version: 1,
  screen: { w: 914, h: 411 },
  elements: [
    { id:"title",  kind:"label",  text:"Draft — Pack 1, Pick 3", x:14, y:10, w:260, h:16, z:6, size:11, align:"start", tone:"ink" },
    { id:"packno", kind:"label",  text:"15 cards in the pack",   x:14, y:27, w:260, h:14, z:6, size:9,  align:"start", tone:"muted" },
    { id:"clock",  kind:"pill",   text:"1:42", x:790, y:9, w:70, h:20, z:7, size:12, align:"center", tone:"metal" },
    { id:"left",   kind:"pill",   text:"8 picks left", x:700, y:9, w:84, h:20, z:7, size:10, align:"center", tone:"metal" },

    { id:"packpanel", kind:"panel", text:"Pack", x:14, y:48, w:474, h:250, z:1, size:9, align:"start", tone:"muted" },
    { id:"pack",   kind:"cardrow", text:"", x:18, y:62, w:466, h:232, z:2, size:9, align:"center", tone:"muted", count:15, cols:5,
      cards:["Llanowar Elves","Grizzly Bears","Arbor Elf","Vampire Nighthawk","Bloodghast","Sol Ring","Cultivate","Rancor","Harmonize",
             "Overrun","Eternal Witness","Beast Within","Forest","Swamp","Island"] },

    { id:"pickpanel", kind:"panel", text:"Your picks", x:500, y:48, w:400, h:150, z:1, size:9, align:"start", tone:"muted" },
    { id:"picks",  kind:"cardrow", text:"", x:504, y:62, w:392, h:132, z:2, size:9, align:"center", tone:"muted", count:3, cols:3,
      cards:["Forest","Beast Within","Eternal Witness"] },

    { id:"poolpanel", kind:"panel", text:"Pool", x:500, y:206, w:400, h:92, z:1, size:9, align:"start", tone:"muted" },
    { id:"pool",   kind:"cardrow", text:"", x:504, y:220, w:392, h:74, z:2, size:9, align:"center", tone:"muted", count:6, cols:6,
      cards:["Forest","Island","Swamp","Command Tower","Overgrown Tomb","Barren Moor"] },

    { id:"pickbtn", kind:"button", text:"Pick", x:14, y:306, w:120, h:34, z:8, size:12, align:"center", tone:"ink" },
    { id:"donebtn", kind:"button", text:"Done drafting", x:144, y:306, w:150, h:34, z:8, size:12, align:"center", tone:"ink" },
    { id:"hint",   kind:"label",  text:"Tap a card to pick it, press and hold to read it", x:14, y:352, w:520, h:16, z:6, size:9, align:"start", tone:"muted" },
    { id:"life",   kind:"pill",   text:"Deck 40", x:790, y:306, w:110, h:22, z:7, size:10, align:"center", tone:"metal" },
    { id:"mid",    kind:"divider", text:"", x:492, y:52, w:2, h:246, z:3, size:9, align:"center", tone:"muted" }
  ]
};

window.onerror = (m, src, line, col) => {
  const n = document.getElementById("note");
  if (n) n.textContent = "error: " + m + " @ " + line + ":" + col;
};

const KINDS = ["label","pill","button","panel","card","cardrow","divider"];
const SAMPLE = Object.keys(CARDS);

let cfg = load() || JSON.parse(JSON.stringify(STARTER));
let sel = null;
let uid = 1;

const $ = id => document.getElementById(id);
const stage = $("stage"), wrap = $("wrap");

function load(){ try { const s = localStorage.getItem("draft-layout"); return s ? JSON.parse(s) : null; } catch(e){ return null; } }
function save(){ try { localStorage.setItem("draft-layout", JSON.stringify(cfg)); } catch(e){} }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function elById(id){ return cfg.elements.find(e => e.id === id); }
function nextId(kind){ const base = kind + "-" + (uid++); return cfg.elements.some(e => e.id === base) ? nextId(kind) : base; }

function fit(){
  const w = cfg.screen.w, h = cfg.screen.h;
  const avail = Math.max(240, wrap.clientWidth);
  const k = Math.min(1, avail / w);
  stage.style.width = w + "px"; stage.style.height = h + "px";
  stage.style.transform = "scale(" + k + ")";
  wrap.style.height = (h * k) + "px";
}
window.addEventListener("resize", fit);

/* ---- drawing ------------------------------------------------------------ */

function paintStage(){
  stage.innerHTML = "";
  cfg.screen.w && fit();
  cfg.elements.slice().sort((a,b)=>a.z-b.z).forEach(el => stage.appendChild(elNode(el)));
  readout();
}

function elNode(e){
  const n = document.createElement("div");
  n.className = "el" + (sel === e.id ? " sel" : "");
  n.dataset.id = e.id;
  n.style.cssText = `left:${e.x}px;top:${e.y}px;width:${e.w}px;height:${e.h}px;z-index:${e.z}`;
  if (e.visible === false) n.style.opacity = ".25";

  if (e.kind === "label"){
    n.classList.add("label");
    if (e.tone === "muted") n.classList.add("muted");
    n.style.fontSize = e.size + "px";
    n.style.textAlign = e.align;
    n.style.color = e.tone === "metal" ? "var(--metal)" : "";
    n.textContent = e.text || "";
  } else if (e.kind === "pill"){
    n.classList.add("pill");
    n.style.fontSize = e.size + "px";
    n.textContent = e.text || "";
  } else if (e.kind === "button"){
    n.classList.add("button");
    n.style.fontSize = e.size + "px";
    n.textContent = e.text || "";
  } else if (e.kind === "panel"){
    n.classList.add("panel");
    n.style.fontSize = e.size + "px";
    n.textContent = e.text || "";
  } else if (e.kind === "divider"){
    n.classList.add("divider");
  } else if (e.kind === "card"){
    n.appendChild(cardNode(e.name || SAMPLE[0], e.w, e.h, false));
  } else if (e.kind === "cardrow"){
    n.appendChild(rowNode(e));
  }

  const h = document.createElement("div");
  h.className = "handle"; h.dataset.handle = "1";
  n.appendChild(h);
  return n;
}

function cardNode(name, w, h, tapped){
  const box = document.createElement("div");
  box.style.cssText = "position:absolute;inset:0";
  const url = CARDS[name];
  if (url){
    const img = document.createElement("img");
    img.className = "cardimg"; img.src = url; img.alt = name; img.draggable = false;
    img.onerror = () => { img.remove(); box.appendChild(cardText(name)); };
    box.appendChild(img);
  } else {
    box.appendChild(cardText(name));
  }
  return box;
}

function cardText(name){
  const t = document.createElement("div");
  t.className = "cardtext"; t.textContent = name;
  return t;
}

/* A row of cards that fills its box: as many as it holds at a readable size, the rest clipped. */
function rowNode(e){
  const row = document.createElement("div");
  row.className = "row";
  const names = (e.cards && e.cards.length ? e.cards : SAMPLE);
  const n = Math.max(1, e.count || names.length);
  if (e.cols > 1){
    const grid = document.createElement("div");
    grid.style.cssText = "position:absolute;inset:0;display:grid;gap:2px;align-content:start;" +
      "grid-template-columns:repeat(" + e.cols + ",minmax(0,1fr))";
    const rows = Math.ceil(n / e.cols);
    const cellH = Math.max(10, (e.h - (rows - 1) * 2) / rows);
    for (let i = 0; i < n; i++){
      const cell = document.createElement("div");
      cell.style.cssText = "position:relative;height:" + cellH + "px";
      cell.appendChild(cardNode(names[i % names.length], 0, cellH, false));
      grid.appendChild(cell);
    }
    return grid;
  }
  const gap = 2;
  const byHeight = e.h;
  const cardW = byHeight * 63 / 88;
  const step = Math.min(cardW + gap, Math.max(8, (e.w - cardW) / Math.max(1, n - 1)));
  for (let i = 0; i < n; i++){
    const slot = document.createElement("div");
    slot.className = "slot";
    slot.style.width = (i === n - 1 ? cardW : step) + "px";
    slot.style.marginLeft = i === 0 ? 0 : "-" + (cardW - step) + "px";
    slot.style.position = "relative";
    slot.appendChild(cardNode(names[i % names.length], cardW, byHeight, false));
    row.appendChild(slot);
  }
  return row;
}

function readout(){
  const n = cfg.elements.length;
  const kinds = {};
  cfg.elements.forEach(e => kinds[e.kind] = (kinds[e.kind] || 0) + 1);
  const parts = Object.entries(kinds).map(([k,v]) => `<b>${v}</b> ${k}${v>1?"s":""}`);
  $("readout").innerHTML = `<span><b>${cfg.screen.w}×${cfg.screen.h}</b> dp</span>` +
    `<span><b>${n}</b> elements</span>` + parts.map(p=>`<span>${p}</span>`).join("");
}

/* ---- the inspector ------------------------------------------------------ */

function paintList(){
  const list = $("list");
  list.innerHTML = "";
  cfg.elements.slice().sort((a,b)=>b.z-a.z).forEach(e => {
    const row = document.createElement("div");
    row.className = "item" + (sel === e.id ? " on" : "");
    row.innerHTML = `<span class="k">${e.z}</span><b>${e.id}</b><span class="k">${e.kind}</span>`;
    const eye = document.createElement("button"); eye.textContent = e.visible === false ? "○" : "●";
    eye.title = "show or hide";
    eye.onclick = ev => { ev.stopPropagation(); e.visible = e.visible === false; commit(); };
    const up = document.createElement("button"); up.textContent = "↑"; up.title = "bring forward";
    up.onclick = ev => { ev.stopPropagation(); e.z++; commit(); };
    const del = document.createElement("button"); del.textContent = "✕"; del.title = "remove";
    del.onclick = ev => { ev.stopPropagation(); cfg.elements = cfg.elements.filter(x => x.id !== e.id);
      if (sel === e.id) sel = null; commit(); };
    row.append(eye, up, del);
    row.onclick = () => { sel = e.id; paintStage(); paintList(); paintInspector(); };
    list.appendChild(row);
  });
}

function paintInspector(){
  const e = sel ? elById(sel) : null;
  $("inspEmpty").style.display = e ? "none" : "";
  $("inspBody").style.display = e ? "" : "none";
  if (!e) return;
  $("eName").value = e.id;
  $("eKind").value = e.kind;
  $("eX").value = Math.round(e.x); $("eY").value = Math.round(e.y);
  $("eW").value = Math.round(e.w); $("eH").value = Math.round(e.h);
  $("eText").value = e.text || "";
  $("eCount").value = e.count || 1;
  $("eSize").value = e.size || 10;
  $("eAlign").value = e.align || "start";
  $("eTone").value = e.tone || "ink";
  const hasText = ["label","pill","button","panel"].includes(e.kind);
  $("eTextRow").style.display = hasText ? "" : "none";
  $("eCardRow").style.display = e.kind === "card" ? "" : "none";
  const picker = $("eCard");
  if (e.kind === "card"){
    picker.innerHTML = SAMPLE.map(n => `<option${n === e.name ? " selected" : ""}>${n}</option>`).join("");
  }
  $("eCountWrap").style.display = e.kind === "cardrow" ? "" : "none";
  $("eColsWrap").style.display = e.kind === "cardrow" ? "" : "none";
  $("eCols").value = e.cols || 1;
}

function numberField(id, key){
  $(id).addEventListener("input", ev => {
    const e = sel ? elById(sel) : null; if (!e) return;
    const v = parseFloat(ev.target.value); if (isNaN(v)) return;
    e[key] = v; commit(false);
  });
}
["eX","eY","eW","eH"].forEach((id,i) => numberField(id, ["x","y","w","h"][i]));
numberField("eSize", "size");
numberField("eCount", "count");
numberField("eCols", "cols");

$("eName").addEventListener("input", ev => {
  const e = sel ? elById(sel) : null; if (!e) return;
  const v = (ev.target.value || "").trim().replace(/\s+/g,"-");
  if (!v || cfg.elements.some(x => x !== e && x.id === v)) return;
  const old = e.id; e.id = v; sel = v;
  cfg.elements.forEach(x => { if (x.after === old) x.after = v; });
  paintStage(); paintList(); paintInspector();
});
$("eText").addEventListener("input", ev => {
  const e = sel ? elById(sel) : null; if (!e) return;
  e.text = ev.target.value; paintStage();
});
$("eCard").addEventListener("change", ev => {
  const e = sel && elById(sel); if (e){ e.name = ev.target.value; paintStage(); }
});
$("eAlign").addEventListener("change", ev => { const e = sel && elById(sel); if (e){ e.align = ev.target.value; paintStage(); } });
$("eTone").addEventListener("change", ev => { const e = sel && elById(sel); if (e){ e.tone = ev.target.value; paintStage(); } });
$("eUp").onclick = () => { const e = sel && elById(sel); if (e){ e.z++; commit(); } };
$("eDown").onclick = () => { const e = sel && elById(sel); if (e){ e.z--; commit(); } };
$("eDup").onclick = () => {
  const e = sel && elById(sel); if (!e) return;
  const copy = clone(e); copy.id = nextId(e.kind); copy.x += 12; copy.y += 12; copy.z = e.z + 1;
  cfg.elements.push(copy); sel = copy.id; commit();
};
$("eDel").onclick = () => {
  if (!sel) return;
  cfg.elements = cfg.elements.filter(x => x.id !== sel); sel = null; commit();
};

/* ---- dragging and resizing ---------------------------------------------- */

let grip = null;

stage.addEventListener("pointerdown", ev => {
  const handle = ev.target.closest("[data-handle]");
  const node = ev.target.closest(".el");
  if (!node) { sel = null; paintStage(); paintList(); paintInspector(); return; }
  const e = elById(node.dataset.id); if (!e) return;
  sel = e.id;
  const rect = stage.getBoundingClientRect();
  const k = rect.width / cfg.screen.w;          // the stage is scaled to fit the panel
  const sx = (ev.clientX - rect.left) / k, sy = (ev.clientY - rect.top) / k;
  grip = handle
    ? { mode:"resize", id:e.id, x0:sx, y0:sy, w0:e.w, h0:e.h }
    : { mode:"move",   id:e.id, x0:sx, y0:sy, ex:e.x, ey:e.y };
  paintStage(); paintList(); paintInspector();
  ev.preventDefault();
});

/* A tap selects, whether it arrives as a pointer or as a plain click: a click with no pointer
   behind it (a test harness, a keyboard) still has to open the inspector. */
stage.addEventListener("click", ev => {
  const node = ev.target.closest(".el");
  const id = node ? node.dataset.id : null;
  if (id === sel) return;
  sel = id;
  paintStage(); paintList(); paintInspector();
});

window.addEventListener("pointermove", ev => {
  if (!grip) return;
  const e = elById(grip.id); if (!e) return;
  const rect = stage.getBoundingClientRect();
  const k = rect.width / cfg.screen.w;
  const snap = Math.max(1, parseFloat($("snap").value) || 1);
  const q = v => Math.round(v / snap) * snap;
  const x = (ev.clientX - rect.left) / k, y = (ev.clientY - rect.top) / k;
  if (grip.mode === "move"){
    e.x = q(grip.ex + (x - grip.x0));
    e.y = q(grip.ey + (y - grip.y0));
  } else {
    e.w = Math.max(8, q(grip.w0 + (x - grip.x0)));
    e.h = Math.max(8, q(grip.h0 + (y - grip.y0)));
  }
  const node = stage.querySelector(`.el[data-id="${grip.id}"]`);
  if (node) node.style.cssText = `left:${e.x}px;top:${e.y}px;width:${e.w}px;height:${e.h}px;z-index:${e.z}`;
});

window.addEventListener("pointerup", ev => {
  if (grip){ grip = null; commit(); }
});

window.addEventListener("keydown", ev => {
  if (ev.target.tagName === "INPUT" || ev.target.tagName === "TEXTAREA" || ev.target.tagName === "SELECT") return;
  const e = sel && elById(sel);
  if (!e) return;
  const step = ev.shiftKey ? 10 : 1;
  const move = (dx,dy) => { e.x += dx; e.y += dy; commit(); ev.preventDefault(); };
  if (ev.key === "ArrowLeft") move(-step,0);
  else if (ev.key === "ArrowRight") move(step,0);
  else if (ev.key === "ArrowUp") move(0,-step);
  else if (ev.key === "ArrowDown") move(0,step);
  else if (ev.key === "Delete" || ev.key === "Backspace"){
    cfg.elements = cfg.elements.filter(x => x.id !== e.id); sel = null; commit(); ev.preventDefault();
  }
  else if (ev.key === "d" && (ev.metaKey || ev.ctrlKey)) $("eDup").click();
  else if (ev.key === "Escape"){ sel = null; paintStage(); paintList(); paintInspector(); }
});

/* ---- adding, presets, export ------------------------------------------- */

$("palette").innerHTML = "";
KINDS.forEach(kind => {
  const b = document.createElement("button");
  b.textContent = "+ " + kind;
  b.onclick = () => {
    const e = { id: nextId(kind), kind, text: labels[kind] || "", x: 40, y: 40, w: 140, h: 24,
                z: 10, size: 11, align: "start", tone: "ink", visible: true };
    if (kind === "panel"){ e.w = 220; e.h = 120; e.text = "Panel"; }
    if (kind === "button"){ e.w = 110; e.h = 32; e.text = "Button"; }
    if (kind === "pill"){ e.w = 80; e.h = 20; e.text = "0"; }
    if (kind === "divider"){ e.w = 2; e.h = 120; }
    if (kind === "card"){ e.w = 63; e.h = 88; e.name = SAMPLE[0]; }
    if (kind === "cardrow"){ e.w = 320; e.h = 90; e.count = 5; e.cards = SAMPLE.slice(0,5); }
    if (kind === "label"){ e.w = 200; e.h = 16; e.text = "Label"; }
    const top = Math.min(...cfg.elements.map(x => x.z), 1) - 1;
    e.z = Math.min(10, Math.max(1, top + 1));
    cfg.elements.push(e); sel = e.id; commit();
  };
  $("palette").appendChild(b);
});

const labels = { label:"Label", pill:"0", button:"Button", panel:"Panel", card:"", cardrow:"", divider:"" };

$("sw").addEventListener("change", ev => { cfg.screen.w = Math.max(200, parseFloat(ev.target.value) || 914); commit(); });
$("sh").addEventListener("change", ev => { cfg.screen.h = Math.max(200, parseFloat(ev.target.value) || 411); commit(); });
function preset(w,h){ cfg.screen = { w, h }; if (w < h) { /* portrait: stack the pack over the picks */
    const pack = elById("packpanel"), packRow = elById("pack"), pick = elById("pickpanel"),
          picks = elById("picks"), pool = elById("poolpanel"), poolRow = elById("pool");
    if (pack && packRow){
      pack.x = 12; pack.y = 44; pack.w = w - 24; pack.h = Math.round(h * 0.44);
      packRow.x = 16; packRow.y = 58; packRow.w = w - 32; packRow.h = pack.h - 20;
      [
        [pick, 44 + Math.round(h * 0.44) + 8, Math.round(h * 0.22)],
        [pool, 44 + Math.round(h * 0.44) + 8 + Math.round(h * 0.22) + 6, Math.round(h * 0.18)]
      ].forEach(([p, y, hh]) => { if (!p) return; p.x = 12; p.y = y; p.w = w - 24; p.h = hh; });
      if (picks){ picks.x = 16; picks.y = pick ? pick.y + 14 : 0; picks.w = w - 32; picks.h = (pick ? pick.h : 80) - 20; }
      if (poolRow){ poolRow.x = 16; poolRow.y = pool ? pool.y + 14 : 0; poolRow.w = w - 32; poolRow.h = (pool ? pool.h : 70) - 20; }
      const btn = elById("pickbtn"), done = elById("donebtn"), life = elById("life"), hint = elById("hint"),
            clock = elById("clock"), left = elById("left"), title = elById("title"), packno = elById("packno");
      if (btn){ btn.x = 12; btn.y = h - 58; btn.w = 120; btn.h = 36; }
      if (done){ done.x = 142; done.y = h - 58; done.w = 150; done.h = 36; }
      if (life){ life.w = 100; life.x = w - 112; life.y = h - 54; }
      if (hint){ hint.x = 12; hint.y = h - 18; hint.w = Math.max(120, w - 240); }
      if (clock){ clock.x = w - 84; clock.y = 8; }
      if (left){ left.x = w - 176; left.y = 8; }
      if (title){ title.w = Math.min(300, w - 200); }
    }
  } else {
    const st = clone(STARTER).elements; cfg.elements = st;
  }
  commit();
}
$("presetLand").onclick = () => { cfg = clone(STARTER); cfg.screen = { w:914, h:411 }; sel = null; commit(); };
$("presetPort").onclick = () => preset(411, 914);
$("presetTall").onclick = () => preset(411, 740);

function commit(repaint = true){
  save();
  if (repaint){ paintStage(); paintList(); paintInspector(); }
  else { readout(); }
  $("out").value = JSON.stringify(exportShape(), null, 2);
}
$("refresh").onclick = () => commit();
$("copy").onclick = async () => {
  $("out").select();
  try { await navigator.clipboard.writeText($("out").value); $("note").textContent = "copied"; }
  catch(e){ document.execCommand && document.execCommand("copy"); $("note").textContent = "selected, copy it"; }
};
$("reset").onclick = () => { cfg = clone(STARTER); sel = null; commit(); $("note").textContent = "back to the starter"; };
$("apply").onclick = () => {
  try {
    const d = JSON.parse($("in").value);
    if (!d || !Array.isArray(d.elements)) throw new Error("no elements");
    cfg = { kind: d.kind || "deckforge.battle.draft", version: 1,
            screen: d.screen || { w:914, h:411 },
            elements: d.elements.map((e,i) => Object.assign(
              { id:"el-"+i, kind:"panel", x:10, y:10, w:100, h:60, z:1, size:10, align:"start",
                tone:"ink", visible:true }, e)) };
    sel = null; commit(); $("note").textContent = "imported " + cfg.elements.length + " elements";
  } catch(e){ $("note").textContent = "that did not parse: " + e.message; }
};

function exportShape(){
  return { kind:"deckforge.battle.draft", version:1,
    screen: { w: cfg.screen.w, h: cfg.screen.h },
    elements: cfg.elements.slice().sort((a,b)=>a.z-b.z).map(e => {
      const o = { id:e.id, kind:e.kind, x:Math.round(e.x), y:Math.round(e.y),
                  w:Math.round(e.w), h:Math.round(e.h), z:e.z };
      if (e.text) o.text = e.text;
      if (e.size) o.size = e.size;
      if (e.align) o.align = e.align;
      if (e.tone) o.tone = e.tone;
      if (e.count) o.count = e.count;
      if (e.cards && e.cards.length) o.cards = e.cards;
      if (e.name) o.name = e.name;
      if (e.visible === false) o.visible = false;
      return o;
    })};
}

try { paintStage(); paintList(); paintInspector(); commit(); }
catch (err) { const n = document.getElementById("note");
  if (n) n.textContent = "startup: " + err.message + " | " + String(err.stack || "").split("\n")[1]; }
</script>
</body>
