<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeckForge</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0f19;
    --panel: #121826;
    --line: #23304a;
    --text: #e8edf7;
    --muted: #93a1bd;
    --accent: #f5b544;
    --accent-dim: #8a6520;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding-bottom: 48px;
  }
  a { color: var(--accent); }

  header {
    position: sticky;
    top: 0;
    z-index: 5;
    background: linear-gradient(180deg, #131a29 0%, #101725 100%);
    border-bottom: 1px solid var(--line);
    padding: 14px 16px 12px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .brand b { color: var(--accent); font-weight: 700; }
  h1 {
    margin: 6px 0 2px;
    font-size: 21px;
    line-height: 1.2;
    font-weight: 700;
    overflow-wrap: anywhere;
  }
  .meta { color: var(--muted); font-size: 13px; }
  .meta em { color: var(--text); font-style: normal; }
  .head-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 10px;
  }
  .value { font-size: 13px; color: var(--muted); }
  .value b { color: var(--accent); font-weight: 700; font-size: 15px; }
  .actions { display: flex; gap: 8px; }
  button {
    background: #1b2436;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 11px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent-dim); color: var(--accent); }

  main { max-width: 760px; margin: 0 auto; padding: 0 16px; }
  h2 {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin: 22px 0 8px;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    border-bottom: 1px solid var(--line);
    padding-bottom: 6px;
  }
  h2 span { font-weight: 400; letter-spacing: 0; text-transform: none; color: #6f7d99; }

  .card {
    display: grid;
    grid-template-columns: 34px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    border-bottom: 1px solid #171f2e;
  }
  .qty { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; text-align: right; }
  .name { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .foil { color: #7fb2ff; font-size: 11px; border: 1px solid #2b4a7a; border-radius: 4px; padding: 0 3px; }
  .right { text-align: right; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .cost { color: #b9c6dd; font-size: 12px; letter-spacing: 0.02em; }
  .set { color: #6f7d99; font-size: 11px; }
  .art {
    display: none;
    width: 34px;
    height: 34px;
    border-radius: 5px;
    object-fit: cover;
    object-position: center 22%;
    background: #1a2233;
  }
  body.art .art { display: block; }
  body.art .card { grid-template-columns: 26px 34px 1fr auto; }
  .empty, .note {
    margin: 18px 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
  }
  .note b { color: var(--text); }
  footer {
    max-width: 760px;
    margin: 26px auto 0;
    padding: 0 16px;
    color: #55637d;
    font-size: 12px;
  }
  .spinner {
    display: inline-block;
    width: 11px;
    height: 11px;
    border: 2px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: -1px;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand"><b>DeckForge</b><span>shared deck</span></div>
    <h1 id="deck-name">Shared deck</h1>
    <div class="meta" id="deck-meta"></div>
    <div class="head-row">
      <div class="value" id="deck-value"></div>
      <div class="actions">
        <button id="toggle-art" type="button">Show art</button>
        <button id="copy-list" type="button">Copy list</button>
      </div>
    </div>
  </div>
</header>

<main id="deck">
  <p class="empty" id="loading"><span class="spinner"></span>Reading the deck…</p>
</main>

<footer>
  A deck shared from DeckForge. The list is carried inside the link itself; nothing is stored here.
</footer>

<script>
(function () {
  "use strict";

  var SECTIONS = [
    { key: "commander", label: "Commander" },
    { key: "companion", label: "Companion" },
    { key: "planeswalker", label: "Planeswalkers" },
    { key: "battle", label: "Battles" },
    { key: "creature", label: "Creatures" },
    { key: "instant", label: "Instants" },
    { key: "sorcery", label: "Sorceries" },
    { key: "enchantment", label: "Enchantments" },
    { key: "artifact", label: "Artifacts" },
    { key: "land", label: "Lands" },
    { key: "other", label: "Other" },
    { key: "side", label: "Sideboard" }
  ];

  var deck = null;
  var info = {}; // printing id -> scryfall card

  function money(value) {
    if (value === null || value === undefined || isNaN(value)) return "—";
    return "$" + Number(value).toFixed(2);
  }

  function sectionFor(line, card) {
    if (line.board === "commander") return "commander";
    if (line.board === "companion") return "companion";
    if (line.board === "side") return "side";
    var type = (card && card.type_line ? card.type_line : "").toLowerCase();
    if (!type) return "other";
    if (type.indexOf("planeswalker") >= 0) return "planeswalker";
    if (type.indexOf("battle") >= 0) return "battle";
    if (type.indexOf("creature") >= 0) return "creature";
    if (type.indexOf("instant") >= 0) return "instant";
    if (type.indexOf("sorcery") >= 0) return "sorcery";
    if (type.indexOf("enchantment") >= 0) return "enchantment";
    if (type.indexOf("artifact") >= 0) return "artifact";
    if (type.indexOf("land") >= 0) return "land";
    return "other";
  }

  function priceOf(line, card) {
    if (!card || !card.prices) return null;
    var foil = line.foilQuantity >= line.quantity && line.quantity > 0;
    var plain = parseFloat(card.prices.usd || "");
    var shiny = parseFloat(card.prices.usd_foil || "");
    if (foil) return isNaN(shiny) ? (isNaN(plain) ? null : plain) : shiny;
    return isNaN(plain) ? (isNaN(shiny) ? null : shiny) : plain;
  }

  function nameOf(line, card) {
    return (card && card.name) || line.name || "Unknown card";
  }

  // The printing is the identity: look each line up by its Scryfall id, and only fall back to
  // set + collector number or a bare name when a payload came from an older build.
  function identifiersFor(lines) {
    return lines.map(function (line) {
      if (line.printingId) return { id: line.printingId };
      if (line.set && line.number) return { set: line.set.toLowerCase(), collector_number: line.number };
      return { name: line.name };
    });
  }

  function wait(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  // Scryfall wants one request at a time: two in flight at once comes back 429 and the page would
  // quietly lose every price. So the batches go one after another, and a 429 waits and tries again.
  function postBatch(batch, attempt) {
    return fetch("https://api.scryfall.com/cards/collection", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ identifiers: identifiersFor(batch) })
    }).then(function (response) {
      if (response.status === 429 && attempt < 3) {
        return wait(700 * (attempt + 1)).then(function () { return postBatch(batch, attempt + 1); });
      }
      if (!response.ok) throw new Error("Scryfall answered " + response.status);
      return response.json();
    }).then(function (body) {
      return (body && body.data) || [];
    });
  }

  function fetchCards(lines) {
    var batches = [];
    for (var i = 0; i < lines.length; i += 75) batches.push(lines.slice(i, i + 75));
    return batches.reduce(function (chain, batch) {
      return chain.then(function (all) {
        return postBatch(batch, 0)
          .then(function (cards) { return all.concat(cards); })
          .catch(function () { return all; })
          .then(function (acc) { return wait(120).then(function () { return acc; }); });
      });
    }, Promise.resolve([]));
  }

  function readPayload() {
    function unpack(raw) {
      raw = decodeURIComponent(raw);
      var binary = atob(raw.replace(/-/g, "+").replace(/_/g, "/"));
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      if (typeof DecompressionStream === "undefined") {
        throw new Error("This browser cannot unpack a deck link. Ask for the page file instead.");
      }
      return new Blob([bytes]).stream()
        .pipeThrough(new DecompressionStream("gzip"))
        .getReader().read()
        .then(function (chunk) {
          return JSON.parse(new TextDecoder().decode(chunk.value));
        });
    }

    if (window.DECKFORGE_SEED) return Promise.resolve(window.DECKFORGE_SEED);

    var raw = new URLSearchParams(window.location.search).get("d");
    if (!raw) {
      var hash = window.location.hash || "";
      var at = hash.indexOf("d=");
      if (at >= 0) raw = hash.slice(at + 2).split("&")[0];
    }
    return raw ? unpack(raw) : Promise.reject(new Error("no-deck"));
  }

  // Payload lines arrive as [qty, set, number, foilQty, name, board, printingId].
  function normalise(seed) {
    var lines = (seed.lines || []).map(function (raw, index) {
      if (!Array.isArray(raw)) {
        return { quantity: 1, name: raw.name || "", set: "", number: "", foilQuantity: 0, board: "main", printingId: null, index: index };
      }
      var quantity = parseInt(raw[0], 10) || 1;
      return {
        quantity: quantity,
        set: (raw[1] || "").toUpperCase(),
        number: raw[2] ? String(raw[2]) : "",
        foilQuantity: parseInt(raw[3], 10) || 0,
        name: raw[4] || "",
        board: raw[5] || "main",
        printingId: raw[6] || null,
        index: index
      };
    });
    return {
      name: seed.name || "Shared deck",
      formatLabel: seed.formatLabel || seed.format || "",
      commander: seed.commander || null,
      commander2: seed.commander2 || null,
      lines: lines
    };
  }

  function buildSection(key, entries) {
    var heading = document.createElement("h2");
    var count = entries.reduce(function (total, entry) { return total + entry.line.quantity; }, 0);
    var label = SECTIONS.filter(function (s) { return s.key === key; })[0].label;
    heading.textContent = label;
    var tally = document.createElement("span");
    tally.textContent = count;
    heading.appendChild(tally);

    var fragment = document.createDocumentFragment();
    fragment.appendChild(heading);

    entries.forEach(function (entry) {
      var line = entry.line;
      var card = entry.card;

      var row = document.createElement("div");
      row.className = "card";

      var qty = document.createElement("div");
      qty.className = "qty";
      qty.textContent = line.quantity;
      row.appendChild(qty);

      if (card && card.image_uris && card.image_uris.art_crop) {
        var art = document.createElement("img");
        art.className = "art";
        art.loading = "lazy";
        art.alt = "";
        art.src = card.image_uris.art_crop;
        row.appendChild(art);
      } else {
        var blank = document.createElement("div");
        blank.className = "art";
        row.appendChild(blank);
      }

      var nameCell = document.createElement("div");
      nameCell.className = "name";
      var text = document.createElement("span");
      text.textContent = nameOf(line, card);
      nameCell.appendChild(text);
      if (line.foilQuantity >= line.quantity && line.quantity > 0) {
        var foil = document.createElement("span");
        foil.className = "foil";
        foil.textContent = "foil";
        nameCell.appendChild(foil);
      }
      row.appendChild(nameCell);

      var right = document.createElement("div");
      right.className = "right";
      var cost = card && card.mana_cost ? card.mana_cost.replace(/[{}]/g, "") : "";
      if (cost) {
        var costEl = document.createElement("div");
        costEl.className = "cost";
        costEl.textContent = cost;
        right.appendChild(costEl);
      }
      var setEl = document.createElement("div");
      setEl.className = "set";
      var setLabel = line.set + (line.number ? " " + line.number : "");
      var price = priceOf(line, card);
      if (price !== null && price > 0) {
        setEl.textContent = setLabel ? setLabel + " · " + money(price) : money(price);
      } else {
        setEl.textContent = setLabel;
      }
      right.appendChild(setEl);
      row.appendChild(right);

      fragment.appendChild(row);
    });
    return fragment;
  }

  function render(lookupFailed) {
    if (!deck) return;
    var deckEl = document.getElementById("deck");
    deckEl.innerHTML = "";

    document.getElementById("deck-name").textContent = deck.name;
    document.title = deck.name + " · DeckForge";

    var total = deck.lines.reduce(function (sum, line) { return sum + line.quantity; }, 0);
    var meta = [];
    if (deck.formatLabel) meta.push(deck.formatLabel);
    meta.push(total + (total === 1 ? " card" : " cards"));
    if (deck.commander) {
      var commanders = deck.commander2 ? deck.commander + " + " + deck.commander2 : deck.commander;
      meta.push("commander " + commanders);
    }
    document.getElementById("deck-meta").textContent = meta.join(" · ");

    var groups = {};
    deck.lines.forEach(function (line) {
      var card = line.printingId ? info[line.printingId] : null;
      var key = sectionFor(line, card);
      (groups[key] = groups[key] || []).push({ line: line, card: card });
    });

    SECTIONS.forEach(function (section) {
      var entries = groups[section.key];
      if (!entries) return;
      entries.sort(function (a, b) {
        var ma = a.card && typeof a.card.cmc === "number" ? a.card.cmc : 99;
        var mb = b.card && typeof b.card.cmc === "number" ? b.card.cmc : 99;
        if (ma !== mb) return ma - mb;
        return nameOf(a.line, a.card).localeCompare(nameOf(b.line, b.card));
      });
      document.getElementById("deck").appendChild(buildSection(section.key, entries));
    });

    var value = 0;
    var priced = 0;
    deck.lines.forEach(function (line) {
      var card = line.printingId ? info[line.printingId] : null;
      var price = priceOf(line, card);
      if (price !== null) { value += price * line.quantity; priced += line.quantity; }
    });
    var valueEl = document.getElementById("deck-value");
    if (priced === 0) {
      valueEl.innerHTML = lookupFailed
        ? "<b>—</b> card details unavailable"
        : "<b>—</b> no prices available";
    } else {
      valueEl.innerHTML = "<b>" + money(value) + "</b> market value" +
        (priced < total ? " (" + (total - priced) + " unpriced)" : "");
    }
  }

  function copyList() {
    if (!deck) return;
    var lines = deck.lines.map(function (line) {
      var card = line.printingId ? info[line.printingId] : null;
      return line.quantity + " " + nameOf(line, card);
    });
    var text = deck.name + "\n\n" + lines.join("\n");
    var button = document.getElementById("copy-list");
    function done(label) {
      button.textContent = label;
      setTimeout(function () { button.textContent = "Copy list"; }, 1400);
    }
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function () { done("Copied"); }, function () { done("Copy failed"); });
    } else {
      done("Copy failed");
    }
  }

  function showError(message) {
    var main = document.getElementById("deck");
    main.innerHTML = "";
    var note = document.createElement("p");
    note.className = "note";
    note.innerHTML = message;
    main.appendChild(note);
  }

  document.getElementById("toggle-art").addEventListener("click", function () {
    var on = document.body.classList.toggle("art");
    this.textContent = on ? "Hide art" : "Show art";
    try { localStorage.setItem("deckforge.art", on ? "1" : "0"); } catch (e) {}
  });
  document.getElementById("copy-list").addEventListener("click", copyList);

  if (localStorage.getItem("deckforge.art") === "1") {
    document.body.classList.add("art");
    document.getElementById("toggle-art").textContent = "Hide art";
  }

  readPayload().then(function (seed) {
    deck = normalise(seed);
    render(); // first paint from the link alone, so a slow network still shows the list
    return fetchCards(deck.lines).then(function (cards) {
      cards.forEach(function (card) { if (card && card.id) info[card.id] = card; });
      render(cards.length === 0 && deck.lines.length > 0);
    });
  }).catch(function (error) {
    if (error && error.message === "no-deck") {
      showError("<b>No deck in this link.</b><br>A deck link carries the list inside the address " +
        "itself. Open the one you were sent, or share a deck from the DeckForge app.");
    } else {
      showError("<b>This link could not be read.</b><br>" + (error && error.message ? error.message : "Unknown error"));
    }
  });
})();
</script>
</body>
</html>
