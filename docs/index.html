<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeckForge</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0f19;
    --line: #23304a;
    --text: #e8edf7;
    --muted: #93a1bd;
    --faint: #6f7d99;
    --accent: #f5b544;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding-bottom: 40px;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
  }
  body.locked { overflow: hidden; }
  .wrap { max-width: 760px; margin: 0 auto; }

  header {
    position: sticky;
    top: 0;
    z-index: 5;
    background: linear-gradient(180deg, #131a29 0%, #101725 100%);
    border-bottom: 1px solid var(--line);
    padding: 12px 14px 10px;
  }
  .brand {
    display: flex; align-items: baseline; gap: 7px;
    font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
  }
  .brand b { color: var(--accent); font-weight: 700; }
  h1 {
    margin: 5px 0 2px; font-size: 20px; line-height: 1.2; font-weight: 700;
    overflow-wrap: anywhere;
  }
  .meta { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
  .head-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-top: 8px; flex-wrap: wrap;
  }
  .value { font-size: 12.5px; color: var(--muted); }
  .value b { color: var(--accent); font-weight: 700; font-size: 15px; }
  /* The link beside the buttons wears the same chip: an anchor styled only by its [type] reads as
     bare text, which is exactly how it looked before. */
  button, .head-actions a {
    font-family: inherit; font-size: 12px; color: var(--text);
    background: #1b2436; border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 11px; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center;
    gap: 6px; line-height: 1.2; white-space: nowrap;
  }
  button:hover, .head-actions a:hover { border-color: #8a6520; color: var(--accent); }
  button:active, .head-actions a:active { transform: translateY(1px); }
  /* inline-flex above would otherwise beat the browser's own [hidden] rule. */
  [hidden] { display: none !important; }

  main { padding: 0 14px; }
  h2 {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    margin: 20px 0 6px; padding-bottom: 5px;
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted); font-weight: 600;
    border-bottom: 1px solid var(--line);
  }
  h2 span { font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--faint); }

  .row {
    display: grid;
    grid-template-columns: 22px 46px minmax(0, 1fr) auto;
    align-items: center;
    gap: 9px;
    width: 100%;
    padding: 5px 0;
    border: 0;
    border-bottom: 1px solid #171f2e;
    background: none;
    border-radius: 0;
    text-align: left;
    color: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  .row:hover { background: #101725; }
  .row:active { background: #141c2b; }
  .qty { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12.5px; text-align: right; }
  .thumb {
    width: 46px; height: 34px; border-radius: 5px;
    object-fit: cover; object-position: center 25%;
    background: #182031; display: block;
  }
  .name {
    display: flex; align-items: center; gap: 6px;
    min-width: 0; overflow: hidden;
  }
  .name em {
    font-style: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .foil {
    flex: 0 0 auto; color: #7fb2ff; font-size: 10px;
    border: 1px solid #2b4a7a; border-radius: 4px; padding: 0 3px;
  }
  .price { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .note { margin: 16px 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
  .note b { color: var(--text); }
  footer { padding: 22px 14px 0; color: #55637d; font-size: 11.5px; }
  .spin {
    display: inline-block; width: 10px; height: 10px; margin-right: 6px;
    border: 2px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* The card viewer: full screen, one card at a time, swipe or arrow between them. */
  #viewer {
    position: fixed; inset: 0; z-index: 40;
    display: none;
    background: rgba(6, 9, 15, 0.965);
    padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
  }
  #viewer.open { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
  .v-top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; color: var(--muted); font-size: 12px;
  }
  .v-close {
    background: #1b2436; border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; width: 32px; height: 32px; font-size: 16px; line-height: 1;
    cursor: pointer; flex: 0 0 auto;
  }
  .v-stage {
    min-height: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    gap: 6px; padding: 8px 0;
    touch-action: pan-y;
  }
  .v-nav {
    flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%;
    background: #1b2436cc; border: 1px solid var(--line); color: var(--text);
    font-size: 18px; line-height: 1; cursor: pointer;
  }
  .v-nav:disabled { opacity: 0.25; cursor: default; }
  .v-card {
    display: block;
    width: auto; height: auto;
    max-width: 100%; max-height: 100%;
    border-radius: 12px; box-shadow: 0 12px 40px #000a;
    background: #131a29;
  }
  #v-picture {
    flex: 1 1 auto; min-width: 0; min-height: 0; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  .v-blank {
    width: min(78vw, 320px); aspect-ratio: 488 / 680;
    display: flex; align-items: center; justify-content: center;
    border: 1px dashed var(--line); border-radius: 12px;
    color: var(--faint); font-size: 12px; text-align: center; padding: 16px;
  }
  .v-info { text-align: center; padding-top: 6px; }
  .head-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }

  /* Everything the page can do hangs off one button, so the header stays one line on a phone. */
  .menu-wrap { position: relative; display: inline-flex; }
  #menu { gap: 7px; }
  #menu .caret { font-size: 9px; opacity: 0.75; transform: translateY(1px); }
  #menu[aria-expanded="true"] { border-color: #8a6520; color: var(--accent); }
  .menu {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 30;
    min-width: 232px; padding: 6px;
    background: #141c2b; border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 18px 40px #0007;
    display: flex; flex-direction: column; gap: 2px;
  }
  .menu-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%; text-align: left; text-decoration: none;
    background: none; border: 0; border-radius: 7px;
    padding: 9px 10px; color: var(--text); font-size: 13px; cursor: pointer;
  }
  .menu-item:hover, .menu-item:focus-visible { background: #1d283c; color: var(--accent); outline: none; }
  .menu-item small { color: var(--faint); font-size: 10.5px; white-space: nowrap; }
  .menu-item.done { color: #7fd6a0; }
  .menu-sep {
    margin: 5px 4px 3px; padding-top: 8px; border-top: 1px solid var(--line);
    color: var(--muted); font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase;
  }
  .menu-note {
    margin: 2px 4px 4px; padding: 7px 8px; border-radius: 7px;
    background: #101725; color: var(--muted); font-size: 11px; line-height: 1.45;
  }
  .v-name { font-size: 15px; font-weight: 600; margin: 0 0 3px; overflow-wrap: anywhere; }
  .v-line { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .v-line + .v-line { margin-top: 2px; }
  .v-line b { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand"><b>DeckForge</b><span>shared deck</span></div>
    <h1 id="deck-name">Shared deck</h1>
    <div class="meta" id="deck-meta"></div>
    <div class="head-row">
      <div class="value" id="deck-value"><span class="spin"></span>reading the deck…</div>
      <div class="head-actions">
        <div class="menu-wrap">
          <button id="menu" type="button" aria-haspopup="true" aria-expanded="false">
            Options <span class="caret" aria-hidden="true">▼</span>
          </button>
          <div class="menu" id="menu-panel" role="menu" aria-label="Deck options" hidden>
            <button class="menu-item" id="copy-list" type="button" role="menuitem">
              Copy list <small id="copy-note"></small>
            </button>
            <a class="menu-item" id="open-app" role="menuitem" hidden>
              Open in DeckForge <small>Android</small>
            </a>
            <div class="menu-sep" id="menu-buy-sep" hidden>Buy the deck</div>
            <a class="menu-item" data-vendor="manapool" target="_blank" rel="noopener" hidden>
              Mana Pool <small>list loaded</small>
            </a>
            <a class="menu-item" data-vendor="tcgplayer" href="https://www.tcgplayer.com/massentry?productline=Magic" target="_blank" rel="noopener" hidden>
              TCGplayer <small>copies list</small>
            </a>
            <a class="menu-item" data-vendor="cardkingdom" href="https://www.cardkingdom.com/builder" target="_blank" rel="noopener" hidden>
              Card Kingdom <small>copies list</small>
            </a>
            <div class="menu-note" id="menu-note" hidden></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<main class="wrap" id="deck">
  <p class="note"><span class="spin"></span>Reading the deck…</p>
</main>

<footer class="wrap">
  A deck shared from DeckForge. The list is carried inside the link itself; nothing is stored here.
</footer>

<div id="viewer" aria-hidden="true" role="dialog" aria-label="Card viewer">
  <div class="v-top">
    <span id="v-count"></span>
    <button class="v-close" id="v-close" type="button" aria-label="Close">✕</button>
  </div>
  <div class="v-stage" id="v-stage">
    <button class="v-nav" id="v-prev" type="button" aria-label="Previous card">‹</button>
    <div id="v-picture"></div>
    <button class="v-nav" id="v-next" type="button" aria-label="Next card">›</button>
  </div>
  <div class="v-info">
    <p class="v-name" id="v-name"></p>
    <p class="v-line" id="v-type"></p>
    <p class="v-line" id="v-facts"></p>
  </div>
</div>

<script>
(function () {
  "use strict";

  var SECTIONS = [
    { key: "commander", label: "Commander" },
    { key: "companion", label: "Companion" },
    { key: "planeswalker", label: "Planeswalkers" },
    { key: "battle", label: "Battles" },
    { key: "creature", label: "Creatures" },
    { key: "instant", label: "Instants" },
    { key: "sorcery", label: "Sorceries" },
    { key: "enchantment", label: "Enchantments" },
    { key: "artifact", label: "Artifacts" },
    { key: "land", label: "Lands" },
    { key: "other", label: "Other" },
    { key: "side", label: "Sideboard" }
  ];

  var deck = null;      // the deck from the link
  var payloadInAddress = ""; // the ?d= deck this page was opened with, when there was one
  var info = {};        // printing (Scryfall id, or set + number) -> scryfall card
  var display = [];     // every row in the order it is drawn, so the viewer walks the same list
  var lookedUp = false;
  var viewerAt = -1;

  function money(value) {
    if (value === null || value === undefined || isNaN(value)) return "—";
    return "$" + Number(value).toFixed(2);
  }
  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  // A compact line names its printing by set + collector number instead of Scryfall's id, so
  // both keys are indexed and either one finds the card.
  function printingKey(set, number) {
    return "p:" + (set || "").toLowerCase() + "|" + (number || "");
  }
  function cardFor(line) {
    if (line.printingId && info[line.printingId]) return info[line.printingId];
    if (line.set && line.number) return info[printingKey(line.set, line.number)] || null;
    return null;
  }
  function pictures(card) {
    return (card && card.image_uris) || null;
  }
  function nameOf(line, card) {
    if (card && card.name) return card.name;
    if (line.name) return line.name;
    // A compact line carries no name: show the printing until the lookup fills it in.
    var printing = (line.set + " " + line.number).trim();
    return printing || "Unknown card";
  }
  function isFoilLine(line) {
    return line.foilQuantity >= line.quantity && line.quantity > 0;
  }
  function priceOf(line, card) {
    if (!card || !card.prices) return null;
    var plain = parseFloat(card.prices.usd || "");
    var shiny = parseFloat(card.prices.usd_foil || "");
    if (isFoilLine(line)) return isNaN(shiny) ? (isNaN(plain) ? null : plain) : shiny;
    return isNaN(plain) ? (isNaN(shiny) ? null : shiny) : plain;
  }

  function sectionFor(line, card) {
    if (line.board === "commander") return "commander";
    if (line.board === "companion") return "companion";
    if (line.board === "side") return "side";
    var type = (card && card.type_line ? card.type_line : "").toLowerCase();
    if (!type) return "other";
    if (type.indexOf("planeswalker") >= 0) return "planeswalker";
    if (type.indexOf("battle") >= 0) return "battle";
    if (type.indexOf("creature") >= 0) return "creature";
    if (type.indexOf("instant") >= 0) return "instant";
    if (type.indexOf("sorcery") >= 0) return "sorcery";
    if (type.indexOf("enchantment") >= 0) return "enchantment";
    if (type.indexOf("artifact") >= 0) return "artifact";
    if (type.indexOf("land") >= 0) return "land";
    return "other";
  }

  // The printing is the identity: look each line up by its Scryfall id, and only fall back to
  // set + collector number or a bare name when a payload came from an older build.
  function identifiersFor(lines) {
    return lines.map(function (line) {
      if (line.printingId) return { id: line.printingId };
      if (line.set && line.number) return { set: line.set.toLowerCase(), collector_number: line.number };
      return { name: line.name };
    });
  }

  function wait(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  // Scryfall wants one request at a time: two in flight at once comes back 429 and the page would
  // quietly lose every price. So the batches go one after another, and a 429 waits and tries again.
  function postBatch(batch, attempt) {
    return fetch("https://api.scryfall.com/cards/collection", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ identifiers: identifiersFor(batch) })
    }).then(function (response) {
      if (response.status === 429 && attempt < 3) {
        return wait(700 * (attempt + 1)).then(function () { return postBatch(batch, attempt + 1); });
      }
      if (!response.ok) throw new Error("Scryfall answered " + response.status);
      return response.json();
    }).then(function (body) {
      return (body && body.data) || [];
    });
  }

  function fetchCards(lines) {
    var batches = [];
    for (var i = 0; i < lines.length; i += 75) batches.push(lines.slice(i, i + 75));
    return batches.reduce(function (chain, batch) {
      return chain.then(function (all) {
        return postBatch(batch, 0)
          .then(function (cards) { return all.concat(cards); })
          .catch(function () { return all; })
          .then(function (acc) { return wait(120).then(function () { return acc; }); });
      });
    }, Promise.resolve([]));
  }

  function readPayload() {
    function unpack(raw) {
      raw = decodeURIComponent(raw);
      var binary = atob(raw.replace(/-/g, "+").replace(/_/g, "/"));
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      if (typeof DecompressionStream === "undefined") {
        throw new Error("This browser cannot unpack a deck link. Ask for the page file instead.");
      }
      return new Blob([bytes]).stream()
        .pipeThrough(new DecompressionStream("gzip"))
        .getReader().read()
        .then(function (chunk) {
          return JSON.parse(new TextDecoder().decode(chunk.value));
        });
    }

    if (window.DECKFORGE_SEED) return Promise.resolve(window.DECKFORGE_SEED);

    var raw = new URLSearchParams(window.location.search).get("d");
    if (!raw) {
      var hash = window.location.hash || "";
      var at = hash.indexOf("d=");
      if (at >= 0) raw = hash.slice(at + 2).split("&")[0];
    }
    payloadInAddress = raw || "";
    return raw ? unpack(raw) : Promise.reject(new Error("no-deck"));
  }

  // One compact line: `quantity set number [flags]`, flags being f (all copies foil), f2 (two
  // foil), c/p/s (commander, companion, sideboard). A card with no printing falls back to
  // `quantity ! - [flags] | Name`. This matches ShareDeckCodec.compactLine on the app side.
  function parseCompactLine(text) {
    var bar = text.indexOf("|");
    var body = (bar >= 0 ? text.slice(0, bar) : text).trim();
    var name = bar >= 0 ? text.slice(bar + 1).trim() : "";
    var tokens = body.split(/\s+/).filter(function (token) { return token.length > 0; });
    var quantity = parseInt(tokens[0], 10) || 1;
    var set = (tokens[1] || "").toUpperCase();
    var number = tokens[2] || "";
    if (set === "!") { set = ""; number = ""; }
    var foilQuantity = 0;
    var board = "main";
    tokens.slice(3).forEach(function (token) {
      if (token.charAt(0) === "f") {
        var count = parseInt(token.slice(1), 10);
        foilQuantity = isNaN(count) ? quantity : count;
      } else if (token === "c") board = "commander";
      else if (token === "p") board = "companion";
      else if (token === "s") board = "side";
    });
    return { quantity: quantity, set: set, number: number, foilQuantity: foilQuantity,
             name: name, board: board, printingId: null };
  }

  // Two payload versions arrive here: v1 carries arrays with names and Scryfall ids (page files
  // and older links), v2 carries one compact line per card because the printing is enough.
  function normaliseLine(raw, index) {
    if (typeof raw === "string") {
      var line = parseCompactLine(raw);
      line.index = index;
      return line;
    }
    if (Array.isArray(raw)) {
      return {
        quantity: parseInt(raw[0], 10) || 1,
        set: (raw[1] || "").toUpperCase(),
        number: raw[2] ? String(raw[2]) : "",
        foilQuantity: parseInt(raw[3], 10) || 0,
        name: raw[4] || "",
        board: raw[5] || "main",
        printingId: raw[6] || null,
        index: index
      };
    }
    return { quantity: 1, name: (raw && raw.name) || "", set: "", number: "", foilQuantity: 0,
             board: "main", printingId: null, index: index };
  }

  function normalise(seed) {
    var lines = (seed.lines || []).map(normaliseLine);
    return {
      name: seed.name || "Shared deck",
      formatLabel: seed.formatLabel || seed.format || "",
      commander: seed.commander || null,
      commander2: seed.commander2 || null,
      lines: lines
    };
  }

  // ---------------------------------------------------------------- list

  // Art is left to the browser: `loading="lazy"` keeps rows that are off screen from being
  // fetched or decoded, which is what a hundred full-size art crops would otherwise do at once.
  function artThumb(line) {
    var pic = pictures(cardFor(line));
    var url = pic && (pic.art_crop || pic.small || pic.normal);
    var img = el("img", "thumb");
    img.alt = "";
    img.width = 46;
    img.height = 34;
    img.decoding = "async";
    img.loading = "lazy";
    img.referrerPolicy = "no-referrer";
    if (url) img.src = url;
    return img;
  }

  function buildRow(entry) {
    var line = entry.line;
    var card = entry.card;
    var row = el("button", "row");
    row.type = "button";

    row.appendChild(el("div", "qty", String(line.quantity)));
    row.appendChild(artThumb(line));

    var nameCell = el("div", "name");
    nameCell.appendChild(el("em", null, nameOf(line, card)));
    if (isFoilLine(line)) nameCell.appendChild(el("span", "foil", "foil"));
    row.appendChild(nameCell);

    var price = priceOf(line, card);
    row.appendChild(el("div", "price", price === null ? "" : money(price)));

    row.addEventListener("click", function () { openViewer(entry.position); });
    return row;
  }

  function buildSection(section, entries) {
    var fragment = document.createDocumentFragment();
    var heading = el("h2", null, lookedUp || section.key !== "other" ? section.label : "Cards");
    heading.appendChild(el("span", null,
      String(entries.reduce(function (total, entry) { return total + entry.line.quantity; }, 0))));
    fragment.appendChild(heading);
    entries.forEach(function (entry) { fragment.appendChild(buildRow(entry)); });
    return fragment;
  }

  function render() {
    if (!deck) return;
    var main = document.getElementById("deck");
    main.innerHTML = "";
    display = [];

    document.getElementById("deck-name").textContent = deck.name;
    document.title = deck.name + " · DeckForge";

    var total = deck.lines.reduce(function (sum, line) { return sum + line.quantity; }, 0);
    var meta = [];
    if (deck.formatLabel) meta.push(deck.formatLabel);
    meta.push(total + (total === 1 ? " card" : " cards"));
    if (deck.commander) {
      meta.push("commander " + (deck.commander2 ? deck.commander + " + " + deck.commander2 : deck.commander));
    }
    document.getElementById("deck-meta").textContent = meta.join(" · ");

    var groups = {};
    deck.lines.forEach(function (line) {
      var key = sectionFor(line, cardFor(line));
      (groups[key] = groups[key] || []).push({ line: line, card: cardFor(line) });
    });

    SECTIONS.forEach(function (section) {
      var entries = groups[section.key];
      if (!entries) return;
      entries.sort(function (a, b) {
        var ma = a.card && typeof a.card.cmc === "number" ? a.card.cmc : 99;
        var mb = b.card && typeof b.card.cmc === "number" ? b.card.cmc : 99;
        if (ma !== mb) return ma - mb;
        return nameOf(a.line, a.card).localeCompare(nameOf(b.line, b.card));
      });
      entries.forEach(function (entry) {
        entry.position = display.length;
        display.push(entry);
      });
      main.appendChild(buildSection(section, entries));
    });

    var value = 0;
    var priced = 0;
    deck.lines.forEach(function (line) {
      var price = priceOf(line, cardFor(line));
      if (price !== null) { value += price * line.quantity; priced += line.quantity; }
    });
    var valueEl = document.getElementById("deck-value");
    if (!lookedUp) {
      valueEl.innerHTML = '<span class="spin"></span>pricing the deck…';
    } else if (priced === 0) {
      valueEl.innerHTML = "<b>—</b> Scryfall did not answer";
    } else {
      valueEl.innerHTML = "<b>" + money(value) + "</b> market value" +
        (priced < total ? " (" + (total - priced) + " unpriced)" : "");
    }
  }

  // -------------------------------------------------------------- viewer

  function viewerEls() {
    return {
      box: document.getElementById("viewer"),
      picture: document.getElementById("v-picture"),
      count: document.getElementById("v-count"),
      name: document.getElementById("v-name"),
      type: document.getElementById("v-type"),
      facts: document.getElementById("v-facts"),
      prev: document.getElementById("v-prev"),
      next: document.getElementById("v-next")
    };
  }

  function paintViewer() {
    var els = viewerEls();
    var entry = display[viewerAt];
    if (!entry) return;
    var line = entry.line;
    var card = entry.card;
    var pic = pictures(card);

    els.picture.innerHTML = "";
    if (pic && (pic.normal || pic.large || pic.art_crop || pic.small)) {
      var sources = [pic.normal, pic.large, pic.art_crop, pic.small].filter(Boolean);
      var img = el("img", "v-card");
      img.alt = nameOf(line, card);
      img.referrerPolicy = "no-referrer";
      img.decoding = "async";
      var attempt = 0;
      img.addEventListener("error", function () {
        attempt += 1;
        if (attempt < sources.length) img.src = sources[attempt];
        else els.picture.innerHTML = '<div class="v-blank">Card picture did not load</div>';
      });
      img.src = sources[0];
      els.picture.appendChild(img);
    } else {
      var blank = el("div", "v-blank", card ? "No picture for this printing" : "No card data from Scryfall");
      els.picture.appendChild(blank);
    }

    els.count.textContent = (viewerAt + 1) + " / " + display.length;
    els.name.textContent = nameOf(line, card);

    if (card) {
      var bits = [];
      if (line.quantity > 1) bits.push(line.quantity + " copies");
      if (isFoilLine(line)) bits.push("foil");
      if (card.mana_cost) bits.push(card.mana_cost.replace(/[{}]/g, ""));
      els.type.textContent = card.type_line || "";
      els.type.style.display = card.type_line ? "" : "none";

      var facts = [];
      var price = priceOf(line, card);
      if (price !== null && price > 0) facts.push("$" + Number(price).toFixed(2));
      var setLine = line.set + (line.number ? " · " + line.number : "");
      if (setLine) facts.push(setLine);
      if (bits.length) facts.push(bits.join(" · "));
      els.facts.innerHTML = "";
      facts.forEach(function (fact, index) {
        if (index) els.facts.appendChild(document.createTextNode("   "));
        els.facts.appendChild(document.createTextNode(fact));
      });
    } else {
      els.type.style.display = "none";
      els.facts.innerHTML = "";
      var setOnly = line.set + (line.number ? " · " + line.number : "");
      if (setOnly) els.facts.textContent = setOnly;
    }

    els.prev.disabled = viewerAt <= 0;
    els.next.disabled = viewerAt >= display.length - 1;

    // The next card is usually the one being swiped to, so warm it while this one is looked at.
    [viewerAt - 1, viewerAt + 1].forEach(function (near) {
      var other = display[near];
      var otherPic = other && pictures(other.card);
      if (otherPic && otherPic.normal) new Image().src = otherPic.normal;
    });
  }

  function openViewer(position) {
    if (position < 0 || position >= display.length) return;
    viewerAt = position;
    var els = viewerEls();
    els.box.classList.add("open");
    els.box.setAttribute("aria-hidden", "false");
    document.body.classList.add("locked");
    paintViewer();
  }

  function closeViewer() {
    viewerAt = -1;
    var els = viewerEls();
    els.box.classList.remove("open");
    els.box.setAttribute("aria-hidden", "true");
    document.body.classList.remove("locked");
  }

  function step(delta) {
    if (viewerAt < 0) return;
    var next = viewerAt + delta;
    if (next < 0 || next >= display.length) return;
    viewerAt = next;
    paintViewer();
  }

  function wireViewer() {
    var els = viewerEls();
    document.getElementById("v-close").addEventListener("click", closeViewer);
    els.prev.addEventListener("click", function () { step(-1); });
    els.next.addEventListener("click", function () { step(1); });

    // A tap on the dark area beside the card closes it, but a tap on the card itself does not.
    els.box.addEventListener("click", function (event) {
      if (event.target === els.box || event.target.id === "v-stage") closeViewer();
    });

    document.addEventListener("keydown", function (event) {
      if (viewerAt < 0) return;
      if (event.key === "Escape") closeViewer();
      else if (event.key === "ArrowLeft") step(-1);
      else if (event.key === "ArrowRight") step(1);
    });

    // Swipe: horizontal drags move a card, vertical drags are left to the browser.
    var startX = 0, startY = 0, tracking = false;
    var stage = document.getElementById("v-stage");
    stage.addEventListener("touchstart", function (event) {
      if (event.touches.length !== 1) return;
      tracking = true;
      startX = event.touches[0].clientX;
      startY = event.touches[0].clientY;
    }, { passive: true });
    stage.addEventListener("touchend", function (event) {
      if (!tracking) return;
      tracking = false;
      var touch = event.changedTouches[0];
      var dx = touch.clientX - startX;
      var dy = touch.clientY - startY;
      if (Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy)) return;
      step(dx < 0 ? 1 : -1);
    }, { passive: true });

    // Trackpads and mice: horizontal wheel or a simple drag across the stage.
    var dragFrom = null;
    stage.addEventListener("pointerdown", function (event) {
      if (event.pointerType === "mouse") dragFrom = event.clientX;
    });
    stage.addEventListener("pointerup", function (event) {
      if (dragFrom === null) return;
      var dx = event.clientX - dragFrom;
      dragFrom = null;
      if (Math.abs(dx) < 45) return;
      step(dx < 0 ? 1 : -1);
    });
  }

  // ------------------------------------------------------------- buying the deck

  /**
   * Each store wants the list in its own shape, so it is built once per shop rather than hoping
   * one format fits all: Mana Pool and Card Kingdom read "qty Name", TCGplayer's mass entry reads
   * "qty Name [SET] number".
   */
  function buyList(style) {
    var lines = [];
    deck.lines.forEach(function (line) {
      var name = nameOf(line, cardFor(line));
      if (style === "tcg" && line.set) {
        lines.push(line.quantity + " " + name + " [" + line.set + "]" + (line.number ? " " + line.number : ""));
      } else {
        lines.push(line.quantity + " " + name);
      }
    });
    return lines.join("\n");
  }

  /**
   * Mana Pool takes a whole deck in the address: base64 of the pasted list, then URL-encoded.
   * It is the only one of the three that arrives prefilled, so it leads.
   */
  function manaPoolUrl() {
    var text = buyList("plain");
    var bytes = new TextEncoder().encode(text), binary = "";
    for (var i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    return "https://manapool.com/add-deck?deck=" + encodeURIComponent(btoa(binary));
  }

  // ------------------------------------------------------- handing the deck back

  /**
   * The payload this page was opened with. A page file carries its deck in a script instead, so
   * there it is packed again with the browser's own gzip, which keeps the import working offline
   * as well as a link does.
   */
  function payloadForImport() {
    if (payloadInAddress) return Promise.resolve(payloadInAddress);
    if (!window.DECKFORGE_SEED) return Promise.resolve("");
    if (typeof CompressionStream === "undefined") return Promise.resolve("");
    var bytes = new TextEncoder().encode(JSON.stringify(window.DECKFORGE_SEED));
    var stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"));
    return new Response(stream).arrayBuffer().then(function (buffer) {
      var view = new Uint8Array(buffer), binary = "";
      for (var i = 0; i < view.length; i++) binary += String.fromCharCode(view[i]);
      return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    });
  }

  /**
   * An intent:// address is the only shape a browser will hand to an installed app. The fallback
   * is this site's own import page, so a phone without DeckForge lands somewhere that explains
   * itself instead of on a dead link.
   */
  function importAddress(payload) {
    var fallback = new URL("import/", window.location.href).href;
    if (payload) fallback += "?d=" + payload;
    return "intent://import?d=" + payload +
      "#Intent;scheme=deckforge;package=com.soharuda.deckforge;S.browser_fallback_url=" +
      encodeURIComponent(fallback) + ";end";
  }

  // ---- the options menu: every action the page offers lives behind one button --------------
  var MENU_VENDORS = ["manapool", "tcgplayer", "cardkingdom"];

  function wireMenu() {
    var button = document.getElementById("menu");
    var panel = document.getElementById("menu-panel");
    if (!button || !panel) return;

    function close() {
      panel.hidden = true;
      button.setAttribute("aria-expanded", "false");
    }

    button.addEventListener("click", function (event) {
      event.stopPropagation();
      var opening = panel.hidden;
      panel.hidden = !opening;
      button.setAttribute("aria-expanded", opening ? "true" : "false");
      if (!opening) return;
      document.getElementById("menu-note").hidden = true;
      var manapool = panel.querySelector('[data-vendor="manapool"]');
      if (manapool && deck && deck.lines.length) manapool.href = manaPoolUrl();
    });
    document.addEventListener("click", function (event) {
      if (!panel.hidden && !panel.contains(event.target)) close();
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && !panel.hidden) { close(); button.focus(); }
    });

    document.getElementById("copy-list").addEventListener("click", copyList);

    // TCGplayer and Card Kingdom read a paste, not an address, so the list rides out on the
    // clipboard. Mana Pool carries the whole list in the link and needs no help.
    Array.prototype.forEach.call(panel.querySelectorAll("[data-vendor]"), function (link) {
      link.addEventListener("click", function () {
        if (link.getAttribute("data-vendor") !== "manapool" && navigator.clipboard) {
          var style = link.getAttribute("data-vendor") === "tcgplayer" ? "tcg" : "plain";
          navigator.clipboard.writeText(buyList(style));
        }
        setTimeout(close, 40);
      });
    });

    var openApp = document.getElementById("open-app");
    openApp.addEventListener("click", function (event) {
      if (/Android/i.test(navigator.userAgent)) { close(); return; } // the intent address does it
      event.preventDefault();
      var note = document.getElementById("menu-note");
      note.hidden = false;
      note.textContent = "Open this on an Android phone with DeckForge installed and the deck goes straight in.";
    });
  }

  // The deck-dependent items show up only once there is a deck to act on. This runs after the
  // payload is read: wiring it at load left the app link hidden for good, because the payload
  // was still null at that moment.
  function fillMenu() {
    payloadForImport().then(function (payload) {
      if (!payload) return;
      var openApp = document.getElementById("open-app");
      openApp.href = importAddress(payload);
      openApp.hidden = false;
      document.getElementById("menu-buy-sep").hidden = false;
      MENU_VENDORS.forEach(function (vendor) {
        var link = document.querySelector('[data-vendor="' + vendor + '"]');
        if (link) link.hidden = false;
      });
    });
  }

  // ------------------------------------------------------------- actions

  function copyList() {
    if (!deck) return;
    var lines = deck.lines.map(function (line) {
      return line.quantity + " " + nameOf(line, cardFor(line));
    });
    var text = deck.name + "\n\n" + lines.join("\n");
    var note = document.getElementById("copy-note");
    function done(label) {
      if (!note) return;
      note.textContent = label;
      setTimeout(function () { note.textContent = ""; }, 1500);
    }
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function () { done("copied"); }, function () { done("failed"); });
    } else {
      done("failed");
    }
  }

  function showError(message) {
    var main = document.getElementById("deck");
    main.innerHTML = "";
    var note = el("p", "note");
    note.innerHTML = message;
    main.appendChild(note);
    document.getElementById("deck-value").innerHTML = "";
  }

  // A payload this page cannot render should still show the deck rather than an empty screen.
  function plainList(reason) {
    if (!deck) return;
    var main = document.getElementById("deck");
    main.innerHTML = "";
    var note = el("p", "note", reason);
    main.appendChild(note);
    var heading = el("h2", null, "Cards");
    heading.appendChild(el("span", null, String(deck.lines.length)));
    main.appendChild(heading);
    deck.lines.forEach(function (line) {
      main.appendChild(buildRow({ line: line, card: null, position: display.length }));
      display.push({ line: line, card: null });
    });
  }

  // An old page left "art on" behind in storage; nothing reads it now, so clear it on sight.
  try { localStorage.removeItem("deckforge.art"); } catch (e) {}
  wireViewer();
  wireMenu();

  readPayload().then(function (seed) {
    deck = normalise(seed);
    fillMenu();
    try {
      render();
    } catch (error) {
      plainList("Showing the list from the link alone (" + (error && error.message ? error.message : "render failed") + ").");
    }
    return fetchCards(deck.lines).then(function (cards) {
      cards.forEach(function (card) {
        if (!card || !card.id) return;
        info[card.id] = card;
        if (card.set && card.collector_number) {
          info[printingKey(card.set, card.collector_number)] = card;
        }
      });
      lookedUp = true;
      try {
        render();
      } catch (error) {
        plainList("Showing the list from the link alone (" + (error && error.message ? error.message : "render failed") + ").");
      }
    });
  }).catch(function (error) {
    if (error && error.message === "no-deck") {
      showError("<b>No deck in this link.</b><br>A deck link carries the list inside the address " +
        "itself. Open the one you were sent, or share a deck from the DeckForge app.");
    } else {
      showError("<b>This link could not be read.</b><br>" + (error && error.message ? error.message : "Unknown error"));
    }
  });
})();
</script>
</body>
</html>
